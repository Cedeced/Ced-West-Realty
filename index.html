    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>

    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

    </div>

<body>
  <div id="__bundler_placeholder">Loading Ced-West profile page...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"250dfbd7-ddce-4107-9f46-4c533c222ff9\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n</style>\n<style>\nhtml{scroll-behavior:smooth}\nbody{margin:0;font-family:'Hanken Grotesk',Helvetica,sans-serif;background:#f4efe8;color:#15171f}\na{color:#15171f;text-decoration:none}a:hover{color:#7a1f33}\n.pin{background-color:#15171f;background-image:repeating-linear-gradient(90deg,rgba(244,239,232,0.07) 0,rgba(244,239,232,0.07) 1px,transparent 1px,transparent 22px)}\n.pin a{color:#f4efe8}.pin a:hover{color:#e8b9c2}\ninput,textarea,select{font-family:inherit}\ninput:focus,textarea:focus,select:focus,a:focus-visible,button:focus-visible{outline:2px solid #7a1f33;outline-offset:2px}\n</style>\n</helmet>\n<div style=\"width: 100%; min-height: 4700px; box-sizing: border-box; display: flex; flex-direction: column;\">\n\n<header style=\"box-sizing: border-box; width: 100%; padding: 22px 6vw; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid #d9d1c5;\">\n<a href=\"#top\" style=\"display: flex; align-items: baseline; gap: 10px;\">\n<span style=\"font-family: 'Bodoni Moda', Georgia, serif; font-size: 28px; font-weight: 600; letter-spacing: 0.02em;\">Ced-West</span>\n<span style=\"font-family: 'Bodoni Moda', Georgia, serif; font-size: 28px; font-weight: 600; letter-spacing: 0.02em;\">Realty</span>\n</a>\n<nav aria-label=\"Primary\" style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 28px; font-size: 15px; font-weight: 500;\">\n<a href=\"#about\" style=\"padding: 12px 0;\">About</a>\n<a href=\"#services\" style=\"padding: 12px 0;\">Services</a>\n<a href=\"#management\" style=\"padding: 12px 0;\">Property Management</a>\n<a href=\"#marketing\" style=\"padding: 12px 0;\">Marketing</a>\n<a href=\"#contact\" style=\"padding: 13px 22px; background: {{accent}}; color: #ffffff; font-weight: 600; border-radius: 2px;\">Book a consult</a>\n</nav>\n</header>\n\n<section id=\"top\" style=\"box-sizing: border-box; width: 100%; padding: 72px 6vw 88px; display: flex; flex-wrap: wrap; align-items: center; gap: 64px;\">\n<div style=\"flex: 1 1 520px; display: flex; flex-direction: column; gap: 28px;\">\n<div style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: {{accent}};\">Your Premier Real Estate Partner · Los Angeles</div>\n<h1 style=\"margin: 0; font-family: 'Bodoni Moda', Georgia, serif; font-weight: 500; font-size: clamp(44px, 6vw, 88px); line-height: 1.02; letter-spacing: -0.01em;\">Vision, discipline, <em style=\"font-weight: 400; color: {{accent}};\">and heart.</em></h1>\n<p style=\"margin: 0; max-width: 560px; font-size: 19px; line-height: 1.6; color: #3a3b42;\">Cedrick “Ced-West” Grizzard is a licensed Realtor and property management professional with more than 25 years of proven sales experience. Buying, selling, investing, or leasing, he goes above and beyond to build lasting relationships, not just close deals.</p>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px;\">\n<a href=\"#contact\" style=\"padding: 17px 30px; background: #15171f; color: #f4efe8; font-size: 16px; font-weight: 600; border-radius: 2px;\">Start a conversation</a>\n<a href=\"#services\" style=\"padding: 16px 30px; border: 1px solid #15171f; font-size: 16px; font-weight: 600; border-radius: 2px;\">See how Ced works</a>\n</div>\n</div>\n<div style=\"flex: 0 1 420px; display: flex; flex-direction: column; gap: 18px;\">\n<div style=\"position: relative; padding: 0 22px 22px 0; box-sizing: border-box;\">\n<div style=\"position: absolute; right: 0; bottom: 0; width: 82%; height: 82%; background: {{accent}};\"></div>\n<img src=\"2abe503b-673a-4e49-a4bc-be41f7598e03\" alt=\"Portrait of Cedrick Grizzard in a pinstripe jacket and burgundy bow tie\" style=\"position: relative; display: block; width: 100%; max-width: 400px; aspect-ratio: 1 / 1; object-fit: cover;\">\n</div>\n<div style=\"display: flex; flex-direction: column; gap: 2px;\">\n<span style=\"font-family: 'Bodoni Moda', Georgia, serif; font-size: 22px; color: #15171f;\">Cedrick J. Grizzard</span>\n<span style=\"font-size: 13px; letter-spacing: 0.08em; color: #5c5650;\">Realtor® · DRE #01996416</span>\n</div>\n</div>\n</section>\n\n<section class=\"pin\" aria-label=\"At a glance\" style=\"box-sizing: border-box; width: 100%; padding: 44px 6vw; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 32px; color: #f4efe8;\">\n<div style=\"display: flex; flex-direction: column; gap: 6px;\">\n<span style=\"font-family: 'Bodoni Moda', Georgia, serif; font-size: 44px; line-height: 1;\">25+ years</span>\n<span style=\"font-size: 14px; color: #c9c2b8;\">of proven sales experience</span>\n</div>\n<div style=\"display: flex; flex-direction: column; gap: 6px;\">\n<span style=\"font-family: 'Bodoni Moda', Georgia, serif; font-size: 44px; line-height: 1;\">Since 2017</span>\n<span style=\"font-size: 14px; color: #c9c2b8;\">licensed in real estate and property management</span>\n</div>\n<div style=\"display: flex; flex-direction: column; gap: 6px;\">\n<span style=\"font-family: 'Bodoni Moda', Georgia, serif; font-size: 44px; line-height: 1;\">NAR · C.A.R.</span>\n<span style=\"font-size: 14px; color: #c9c2b8;\">National and California Association of Realtors member</span>\n</div>\n<div style=\"display: flex; flex-direction: column; gap: 6px;\">\n<span style=\"font-family: 'Bodoni Moda', Georgia, serif; font-size: 44px; line-height: 1;\">Los Angeles</span>\n<span style=\"font-size: 14px; color: #c9c2b8;\">deep, street-level market knowledge</span>\n</div>\n</section>\n\n<section id=\"about\" style=\"box-sizing: border-box; width: 100%; padding: 104px 6vw; display: flex; flex-wrap: wrap; gap: 64px;\">\n<div style=\"flex: 1 1 320px; display: flex; flex-direction: column; gap: 20px;\">\n<div style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: {{accent}};\">About Ced</div>\n<h2 style=\"margin: 0; font-family: 'Bodoni Moda', Georgia, serif; font-weight: 500; font-size: clamp(34px, 3.6vw, 52px); line-height: 1.1;\">More than a Realtor. A dynamic force in your corner.</h2>\n</div>\n<div style=\"flex: 2 1 520px; display: flex; flex-direction: column; gap: 22px; font-size: 18px; line-height: 1.7; color: #3a3b42;\">\n<p style=\"margin: 0;\">Cedrick is known for exceeding client expectations and delivering results with integrity, creativity, and excellence. Since earning his license in 2017, he has consistently broken revenue records and raised the bar for customer service at every stage of the client journey.</p>\n<p style=\"margin: 0;\">His background is rooted in exceptional client care, expert negotiation, and strategic marketing. Clients describe him as hardworking, reliable, flexible, and a clear communicator, which is how he anticipates what they need and executes under pressure.</p>\n<p style=\"margin: 0;\">Whether he is guiding a first-time buyer or a seasoned investor, Cedrick brings sharp attention to detail, strong problem-solving, and disciplined time management, so the experience stays smooth, informed, and rewarding from start to finish.</p>\n<blockquote style=\"margin: 12px 0 0; padding: 28px 0 0; border-top: 1px solid #15171f; font-family: 'Bodoni Moda', Georgia, serif; font-style: italic; font-size: 28px; line-height: 1.35; color: #15171f;\">He understands both the business side and the human side of real estate.</blockquote>\n</div>\n</section>\n\n<section id=\"services\" style=\"box-sizing: border-box; width: 100%; padding: 96px 6vw; background: #eae3d8; display: flex; flex-direction: column; gap: 48px;\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 720px;\">\n<div style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: {{accent}};\">Services</div>\n<h2 style=\"margin: 0; font-family: 'Bodoni Moda', Georgia, serif; font-weight: 500; font-size: clamp(34px, 3.6vw, 52px); line-height: 1.1;\">Four ways to work with Ced</h2>\n</div>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;\">\n<article style=\"box-sizing: border-box; padding: 32px; background: #f4efe8; border-top: 3px solid #15171f; display: flex; flex-direction: column; gap: 14px;\">\n<span style=\"font-family: 'Bodoni Moda', Georgia, serif; font-style: italic; font-size: 20px; color: {{accent}};\">01</span>\n<h3 style=\"margin: 0; font-family: 'Bodoni Moda', Georgia, serif; font-weight: 500; font-size: 30px;\">Buying</h3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #3a3b42;\">Patient guidance for first-time buyers and a fast, informed process for repeat ones, backed by expert negotiation when it counts.</p>\n</article>\n<article style=\"box-sizing: border-box; padding: 32px; background: #f4efe8; border-top: 3px solid #15171f; display: flex; flex-direction: column; gap: 14px;\">\n<span style=\"font-family: 'Bodoni Moda', Georgia, serif; font-style: italic; font-size: 20px; color: {{accent}};\">02</span>\n<h3 style=\"margin: 0; font-family: 'Bodoni Moda', Georgia, serif; font-weight: 500; font-size: 30px;\">Selling</h3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #3a3b42;\">Strategic marketing and a personalized plan for your property, from pricing and presentation through a clean close.</p>\n</article>\n<article style=\"box-sizing: border-box; padding: 32px; background: #f4efe8; border-top: 3px solid #15171f; display: flex; flex-direction: column; gap: 14px;\">\n<span style=\"font-family: 'Bodoni Moda', Georgia, serif; font-style: italic; font-size: 20px; color: {{accent}};\">03</span>\n<h3 style=\"margin: 0; font-family: 'Bodoni Moda', Georgia, serif; font-weight: 500; font-size: 30px;\">Investing</h3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #3a3b42;\">Analytical, operations-minded advice from someone who has run the buildings, not just toured them.</p>\n</article>\n<article style=\"box-sizing: border-box; padding: 32px; background: #f4efe8; border-top: 3px solid #15171f; display: flex; flex-direction: column; gap: 14px;\">\n<span style=\"font-family: 'Bodoni Moda', Georgia, serif; font-style: italic; font-size: 20px; color: {{accent}};\">04</span>\n<h3 style=\"margin: 0; font-family: 'Bodoni Moda', Georgia, serif; font-weight: 500; font-size: 30px;\">Leasing</h3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #3a3b42;\">Lead Leasing Specialist experience at high-volume Los Angeles communities, applied to filling your units with the right residents.</p>\n</article>\n</div>\n</section>\n\n<section id=\"management\" class=\"pin\" style=\"box-sizing: border-box; width: 100%; padding: 104px 6vw; display: flex; flex-wrap: wrap; gap: 64px; color: #f4efe8;\">\n<div style=\"flex: 1 1 380px; display: flex; flex-direction: column; gap: 22px;\">\n<div style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: #e8b9c2;\">Property Management</div>\n<h2 style=\"margin: 0; font-family: 'Bodoni Moda', Georgia, serif; font-weight: 500; font-size: clamp(34px, 3.6vw, 52px); line-height: 1.1;\">He knows what it takes to protect and enhance property value.</h2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.7; color: #c9c2b8;\">Beyond sales, Cedrick has supported and led leasing and administrative operations at high-volume residential communities across Los Angeles, with leadership roles in Community Management and as Lead Leasing Specialist.</p>\n</div>\n<ul style=\"flex: 1 1 420px; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column;\">\n<li style=\"padding: 22px 0; border-top: 1px solid rgba(244,239,232,0.28); display: flex; gap: 20px; align-items: baseline;\"><span style=\"font-family: 'Bodoni Moda', Georgia, serif; font-style: italic; color: #e8b9c2; font-size: 18px;\">i.</span><span style=\"font-size: 19px;\">Lease file audits</span></li>\n<li style=\"padding: 22px 0; border-top: 1px solid rgba(244,239,232,0.28); display: flex; gap: 20px; align-items: baseline;\"><span style=\"font-family: 'Bodoni Moda', Georgia, serif; font-style: italic; color: #e8b9c2; font-size: 18px;\">ii.</span><span style=\"font-size: 19px;\">Accounts payable and receivable</span></li>\n<li style=\"padding: 22px 0; border-top: 1px solid rgba(244,239,232,0.28); display: flex; gap: 20px; align-items: baseline;\"><span style=\"font-family: 'Bodoni Moda', Georgia, serif; font-style: italic; color: #e8b9c2; font-size: 18px;\">iii.</span><span style=\"font-size: 19px;\">Accurate, well-preserved resident ledgers</span></li>\n<li style=\"padding: 22px 0; border-top: 1px solid rgba(244,239,232,0.28); display: flex; gap: 20px; align-items: baseline;\"><span style=\"font-family: 'Bodoni Moda', Georgia, serif; font-style: italic; color: #e8b9c2; font-size: 18px;\">iv.</span><span style=\"font-size: 19px;\">Low delinquency, consistently maintained</span></li>\n<li style=\"padding: 22px 0; border-top: 1px solid rgba(244,239,232,0.28); border-bottom: 1px solid rgba(244,239,232,0.28); display: flex; gap: 20px; align-items: baseline;\"><span style=\"font-family: 'Bodoni Moda', Georgia, serif; font-style: italic; color: #e8b9c2; font-size: 18px;\">v.</span><span style=\"font-size: 19px;\">Eviction process oversight</span></li>\n</ul>\n</section>\n\n<section id=\"marketing\" style=\"box-sizing: border-box; width: 100%; padding: 104px 6vw; display: flex; flex-direction: column; gap: 48px;\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-end; justify-content: space-between;\">\n<div style=\"flex: 1 1 420px; display: flex; flex-direction: column; gap: 16px;\">\n<div style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: {{accent}};\">Marketing Acumen</div>\n<h2 style=\"margin: 0; font-family: 'Bodoni Moda', Georgia, serif; font-weight: 500; font-size: clamp(34px, 3.6vw, 52px); line-height: 1.1;\">Creative mindset, sharp analytics.</h2>\n</div>\n<p style=\"flex: 1 1 420px; margin: 0; font-size: 18px; line-height: 1.7; color: #3a3b42;\">Cedrick has driven traffic and increased occupancy across multiple properties. He pairs a deep understanding of the Los Angeles market with a personalized plan for every client and every property.</p>\n</div>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0; border-top: 1px solid #15171f; border-bottom: 1px solid #15171f;\">\n<div style=\"box-sizing: border-box; padding: 32px 28px 32px 0; display: flex; flex-direction: column; gap: 10px;\">\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 700;\">Targeted advertising</h3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #3a3b42;\">Campaigns aimed at the buyers and renters most likely to act.</p>\n</div>\n<div style=\"box-sizing: border-box; padding: 32px 28px 32px 0; display: flex; flex-direction: column; gap: 10px;\">\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 700;\">Outreach marketing</h3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #3a3b42;\">Direct, local relationship-building that puts a property in front of the neighborhood.</p>\n</div>\n<div style=\"box-sizing: border-box; padding: 32px 28px 32px 0; display: flex; flex-direction: column; gap: 10px;\">\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 700;\">Social media</h3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #3a3b42;\">Consistent, on-brand presence that keeps listings and communities visible.</p>\n</div>\n<div style=\"box-sizing: border-box; padding: 32px 0 32px 0; display: flex; flex-direction: column; gap: 10px;\">\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 700;\">Client referral programs</h3>\n<p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #3a3b42;\">Happy clients become the strongest lead source there is.</p>\n</div>\n</div>\n</section>\n\n<section id=\"contact\" style=\"box-sizing: border-box; width: 100%; padding: 96px 6vw; background: {{accent}}; color: #ffffff; display: flex; flex-wrap: wrap; gap: 64px;\">\n<div style=\"flex: 1 1 380px; display: flex; flex-direction: column; gap: 24px;\">\n<h2 style=\"margin: 0; font-family: 'Bodoni Moda', Georgia, serif; font-weight: 500; font-size: clamp(38px, 4.4vw, 64px); line-height: 1.05;\">Let’s talk about your next move.</h2>\n<p style=\"margin: 0; font-size: 18px; line-height: 1.7; max-width: 480px;\">Tell Ced what you are working on. He will follow up personally.</p>\n<div style=\"display: flex; flex-direction: column; gap: 12px; font-size: 18px; margin-top: 8px;\">\n<a href=\"tel:+13237339378\" style=\"color: #ffffff; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.4);\">323-733-WEST (9378)</a>\n<a href=\"mailto:Ced@Ced-West.com\" style=\"color: #ffffff; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.4);\">Ced@Ced-West.com</a>\n<span style=\"padding: 8px 0;\">Pinnacle Estate Properties · 20065 Rinaldi St. Suite 210, Porter Ranch, CA 91326</span>\n</div>\n</div>\n<form aria-label=\"Contact Cedrick\" style=\"flex: 1 1 420px; box-sizing: border-box; padding: 36px; background: #f4efe8; color: #15171f; display: flex; flex-direction: column; gap: 18px;\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px;\">\n<div style=\"display: flex; flex-direction: column; gap: 6px;\">\n<label for=\"cw-name\" style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;\">Name</label>\n<input id=\"cw-name\" type=\"text\" autocomplete=\"name\" style=\"box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; font-size: 16px; border: 1px solid #8a8378; background: #ffffff; border-radius: 2px;\">\n</div>\n<div style=\"display: flex; flex-direction: column; gap: 6px;\">\n<label for=\"cw-phone\" style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;\">Phone</label>\n<input id=\"cw-phone\" type=\"tel\" autocomplete=\"tel\" style=\"box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; font-size: 16px; border: 1px solid #8a8378; background: #ffffff; border-radius: 2px;\">\n</div>\n</div>\n<div style=\"display: flex; flex-direction: column; gap: 6px;\">\n<label for=\"cw-email\" style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;\">Email</label>\n<input id=\"cw-email\" type=\"email\" autocomplete=\"email\" style=\"box-sizing: border-box; width: 100%; height: 48px; padding: 0 14px; font-size: 16px; border: 1px solid #8a8378; background: #ffffff; border-radius: 2px;\">\n</div>\n<div style=\"display: flex; flex-direction: column; gap: 6px;\">\n<label for=\"cw-goal\" style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;\">I’m looking to</label>\n<sc-raw-select id=\"cw-goal\" style=\"box-sizing: border-box; width: 100%; height: 48px; padding: 0 12px; font-size: 16px; border: 1px solid #8a8378; background: #ffffff; border-radius: 2px;\">\n<option>Buy a home</option>\n<option>Sell a property</option>\n<option>Invest</option>\n<option>Lease or find a rental</option>\n<option>Discuss property management</option>\n</sc-raw-select>\n</div>\n<div style=\"display: flex; flex-direction: column; gap: 6px;\">\n<label for=\"cw-msg\" style=\"font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;\">A few details</label>\n<textarea id=\"cw-msg\" rows=\"4\" style=\"box-sizing: border-box; width: 100%; padding: 12px 14px; font-size: 16px; line-height: 1.5; border: 1px solid #8a8378; background: #ffffff; border-radius: 2px; resize: vertical;\"></textarea>\n</div>\n<button type=\"button\" style=\"height: 54px; padding: 0 28px; background: #15171f; color: #f4efe8; font-family: inherit; font-size: 16px; font-weight: 600; border: 0; border-radius: 2px; cursor: pointer;\">Send to Ced</button>\n</form>\n</section>\n\n<footer class=\"pin\" style=\"box-sizing: border-box; width: 100%; padding: 48px 6vw; color: #c9c2b8; display: flex; flex-wrap: wrap; gap: 32px; justify-content: space-between; align-items: flex-start; font-size: 14px; line-height: 1.7;\">\n<div style=\"display: flex; flex-direction: column; gap: 6px;\">\n<div style=\"display: flex; align-items: baseline; gap: 8px;\">\n<span style=\"font-family: 'Bodoni Moda', Georgia, serif; font-size: 24px; color: #f4efe8;\">Ced-West</span>\n<span style=\"font-family: 'Bodoni Moda', Georgia, serif; font-size: 24px; color: #f4efe8;\">Realty</span>\n</div>\n<span>Cedrick J. Grizzard, Realtor® · DRE #01996416</span>\n<span>Pinnacle Estate Properties · DRE #00905345</span>\n</div>\n<div style=\"display: flex; flex-direction: column; gap: 6px;\">\n<span>Member, National Association of Realtors®</span>\n<span>Member, California Association of Realtors®</span>\n<span>Equal Housing Opportunity</span>\n</div>\n<div style=\"display: flex; flex-direction: column; gap: 6px;\">\n<a href=\"#top\" style=\"padding: 4px 0;\">Back to top</a>\n<span>© 2026 Ced-West Realty. All rights reserved.</span>\n</div>\n</footer>\n\n</div>\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#7a1f33&quot;,&quot;options&quot;:[&quot;#7a1f33&quot;,&quot;#1f3a5c&quot;,&quot;#2f4a3a&quot;,&quot;#8a5a1c&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:4700}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn { accent: this.props.accent ?? '#7a1f33' };\n}\n}\n<\/script>\n\n\n</body></html>"
